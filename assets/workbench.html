<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>推文工作室 · 样式预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf0f2;color:#243641;font-family:-apple-system,sans-serif}.top{padding:24px 5%;background:#18343e;color:white}h1{font-size:22px;margin:0 0 8px}.top p{font-size:12px;margin:0;color:#c0d5db}.layout{display:grid;grid-template-columns:290px 1fr;gap:36px;max-width:1200px;margin:auto;padding:28px}aside{position:sticky;top:20px;align-self:start;max-height:94vh;overflow:auto}button,select{font:inherit}button{cursor:pointer}.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.themes button{padding:15px 4px;background:white;border:1px solid #cad4d9;color:#365361;border-radius:7px;font-size:13px}.themes button[aria-pressed=true]{background:#244d5b;color:white}.actions button,.actions select{display:block;width:100%;margin:10px 0;padding:11px;border:1px solid #bacdd2;border-radius:6px;background:white;color:#254653;font-size:13px}.actions button.primary{background:#244d5b;color:white}.note{font-size:12px;line-height:1.8;color:#607a85}.stage{min-width:0}iframe{display:block;width:100%;max-width:430px;height:920px;margin:auto;border:0;background:white;box-shadow:0 10px 40px #10273316}#status{font-size:12px;line-height:1.7;min-height:40px;color:#266674}@media(max-width:780px){.layout{display:block;padding:16px}aside{position:static;max-height:none;margin-bottom:20px}.themes{grid-template-columns:repeat(3,1fr)}iframe{height:900px}}</style>
<header class="top"><h1>推文工作室</h1><p>十二种版式 · 三组 AI 主视觉 · 可控动态预览</p></header><div class="layout"><aside><div class="themes" id="themes"></div><div class="actions"><label class="note" for="width">预览宽度</label><select id="width"><option>430</option><option>375</option><option>620</option></select><label class="note"><input id="gray" type="checkbox"> 黑白查看构图</label><label class="note"><input id="exact" type="checkbox" checked> 公众号复制预览（与剪贴板一致）</label><fieldset style="border:1px solid #bdcdd5;border-radius:8px;margin:14px 0;padding:12px;"><legend class="note">动态预览</legend><label class="note" style="display:block"><input id="heroMotion" type="checkbox" checked> 首图与小素材轻浮动</label><label class="note" style="display:block"><input id="ambientMotion" type="checkbox" checked> 背景缓慢流动</label><label class="note" style="display:block"><input id="lineMotion" type="checkbox" checked> 章节线条流光</label><button id="pauseMotion" aria-pressed="false">暂停动效</button><p id="motionStatus" class="note" role="status"></p></fieldset><button id="fold">全部收起</button><button id="expand">全部展开</button><button class="primary" id="copy">复制到公众号（保留格式）</button><button id="manualCopy">手动选择排版</button><button id="download">下载公众号 HTML</button><a href="paste-check.html" target="_blank" class="note">打开本地粘贴检查页 →</a></div><p class="note">默认显示公众号复制版：背景与文字样式直接内联。取消上方勾选可看动态设计方案；动画、拼图与折叠不通过普通粘贴传输。请用 ⌘V / Ctrl+V，勿用“粘贴为纯文本”。本地嵌入图片仍需核对目标编辑器的上传结果。</p><p id="status" role="status"></p></aside><main class="stage"><p id="structure" class="note" style="max-width:430px;margin:0 auto 18px;"></p><iframe id="preview" title="文章预览"></iframe></main></div>
<dialog id="copyDialog" style="width:90%;max-width:600px;border:1px solid #bed0db;border-radius:12px;"><p style="font-size:14px;">排版已选中，请按 ⌘C / Ctrl+C，再到公众号正文普通粘贴。</p><button id="closeCopy">关闭</button><div id="manualPaper" contenteditable="true" style="margin-top:16px;max-height:65vh;overflow:auto;outline:none;"></div></dialog><script>
const variants=__VARIANTS__;let current=3;let motionPaused=false;const frame=document.getElementById('preview');
function show(){const v=variants[current];document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===v.id)));
const css=`__PREVIEW_CSS__`;
const gray=document.getElementById('gray').checked?'filter:grayscale(1);':'';
const exact=document.getElementById('exact').checked;
frame.srcdoc='<html><meta charset="utf-8"><style>body{margin:0;'+gray+'}*{box-sizing:border-box}'+(exact?'':css)+'</style><body class="layout-'+v.id+'">'+(exact?v.exportHtml:v.html)+'</body></html>';document.getElementById('status').textContent=v.name+' · '+(exact?'公众号复制版':'动态设计方案 · 复制时转为公众号版');document.getElementById('structure').textContent=v.description;}
frame.onload=()=>{applyMotion();if(document.getElementById('exact').checked)return;frame.contentDocument.querySelectorAll('.article-section').forEach(s=>{const heading=s.querySelector('.section-heading');const d=frame.contentDocument.createElement('details');d.open=true;const summary=frame.contentDocument.createElement('summary');summary.append(heading);d.append(summary);while(s.firstChild)d.append(s.firstChild);s.append(d)})};
function applyMotion(){const body=frame.contentDocument?.body;if(!body)return;const exact=document.getElementById('exact').checked;for(const [id,cls] of [['heroMotion','motion-hero'],['ambientMotion','motion-ambient'],['lineMotion','motion-lines']])body.classList.toggle(cls,!exact&&document.getElementById(id).checked);body.classList.toggle('motion-paused',motionPaused);document.getElementById('pauseMotion').textContent=motionPaused?'继续动效':'暂停动效';document.getElementById('pauseMotion').setAttribute('aria-pressed',String(motionPaused));document.getElementById('motionStatus').textContent=exact?'导出版式保持静态':matchMedia('(prefers-reduced-motion: reduce)').matches?'系统已开启减少动态效果，当前静止':motionPaused?'动态已暂停':'已开启选中的动态效果';}
for(const id of ['heroMotion','ambientMotion','lineMotion'])document.getElementById(id).onchange=applyMotion;
document.getElementById('pauseMotion').onclick=()=>{motionPaused=!motionPaused;applyMotion()};
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',applyMotion);
document.getElementById('themes').innerHTML=variants.map((v,i)=>'<button data-theme="'+v.id+'" onclick="current='+i+';show()">'+v.name+'</button>').join('');
document.getElementById('width').onchange=e=>frame.style.maxWidth=e.target.value+'px';document.getElementById('fold').onclick=()=>frame.contentDocument.querySelectorAll('details').forEach(d=>d.open=false);document.getElementById('expand').onclick=()=>frame.contentDocument.querySelectorAll('details').forEach(d=>d.open=true);
__CLIPBOARD_JS__
document.getElementById("gray").onchange=show;document.getElementById("exact").onchange=show;show();
</script></html>
