<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>富文本粘贴检查</title><style>body{margin:0;background:#edf2f6;font-family:-apple-system,sans-serif}.toolbar{padding:20px;max-width:700px;margin:auto;color:#234350}.toolbar p{font-size:14px;line-height:1.8}#paper{width:100%;max-width:430px;min-height:600px;margin:20px auto;background:white;outline:1px solid #becdd5}#report{white-space:pre-wrap;font-size:13px}#paper:empty:before{content:'点击这里，按 ⌘V / Ctrl+V 粘贴';color:#89959c;display:block;padding:20px}</style><div class="toolbar"><h1>富文本粘贴检查</h1><p>先在工作台点击“复制到公众号”，再点击下方空白区普通粘贴。此页不主动补入任何文章样式；看到的背景和字体来自剪贴板。此检查不等同于微信保存或发布验证。</p><button id="clear">清空检查区</button><p id="report" role="status">等待粘贴</p></div><div id="paper" contenteditable="true" aria-label="富文本粘贴检查区"></div><script>const paper=document.getElementById('paper');paper.addEventListener('paste',e=>{const html=e.clipboardData.getData('text/html');setTimeout(()=>{const n=paper.querySelectorAll('[style]').length;document.getElementById('report').textContent='收到 HTML：'+(html?'是':'否（可能为纯文本粘贴）')+'\n内联样式节点：'+n+'\n背景声明：'+(html.match(/background(?:-color|-image)?\s*:/g)||[]).length+'\n图片：'+paper.querySelectorAll('img').length+'\n正文字符：'+paper.textContent.length;},0)});document.getElementById('clear').onclick=()=>{paper.replaceChildren();document.getElementById('report').textContent='等待粘贴';paper.focus()};</script></html>
